function randomJPText(){
  const groups = 2 + Math.floor(Math.random()*3); // 2~4 어절
  let out = [];
  for(let g=0; g<groups; g++){
    const len = 2 + Math.floor(Math.random()*3); // 2~4글자

    for(let i=0;i<len;i++){
      word += HIRAGANA[Math.floor(Math.random()*HIRAGANA.length)];

    out.push(word);
  }
  return out.join(" ");
}

function randomJitter(){
  const rotate = (Math.random()*8 - 4).toFixed(1); // -4~4deg

async function sha256(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

/* ============================================================
   방문자 카운터 (IP 기반, UTC 날짜 기준)
============================================================ */
async function runCounter(){
  try{
    const ipRes = await fetch("https://api.ipify.org?format=json");
    const { ip } = await ipRes.json();
    const today = new Date().toISOString().slice(0,10);
    const ref = db.collection(COL_VISITS).doc(today);
    await db.runTransaction(async (tx)=>{
      const snap = await tx.get(ref);
      let ips = [];
      if(snap.exists){ ips = snap.data().ips || []; }
      if(!ips.includes(ip)) ips.push(ip);
      tx.set(ref, { ips }, { merge:true });
    });
    const snap2 = await ref.get();
    document.getElementById("visitCount").textContent = (snap2.data().ips||[]).length;
  }catch(e){
    document.getElementById("visitCount").textContent = "?";
    console.warn("counter error", e);
  }
}

      <div class="row"><button class="plainBtn" onclick="closeMini('adminOverlay')">취소</button>
      <button class="plainBtn" id="loginSaveBtn">로그인</button></div>
    `;
    openMini("adminOverlay");
    document.getElementById("loginSaveBtn").onclick = async ()=>{

      if(hash === settings.adminHash){

        document.getElementById("adminBadge").style.display = "block";
        document.getElementById("dropzone").style.display = "block";
        closeMini("adminOverlay");
        renderGallery();

});

async function tryNsfwUnlock(){
  const settings = await getSettings();
  const pw = document.getElementById("nsfwPw").value;
  const hash = await sha256(pw);
  if(settings && hash === settings.nsfwHash){
    nsfwUnlocked = true;
    closeMini("nsfwOverlay");
    renderGallery();
  }else{
    alert("비밀번호가 틀렸습니다.");
  }
}

/* ============================================================
   갤러리 렌더링 (실시간 구독)
============================================================ */
function renderGallery(){
  const container = document.getElementById("gallery");
  container.innerHTML = "";
  currentGalleryData.forEach((item)=>{
    const jitter = item._jitter;
    const div = document.createElement("div");
    div.className = "g-item" + (item.nsfw && !nsfwUnlocked ? " nsfw-locked" : "");
    div.style.width = jitter.width;
    div.style.transform = `rotate(${jitter.rotate}deg)`;
    div.style.marginTop = jitter.marginTop + "px";

    // 박스 스타일
    const bs = item.boxStyle || {kind:"none"};
    if(bs.kind === "border"){
      div.style.border = `${bs.borderWidth}px ${bs.borderStyle} ${bs.color}`;
      div.style.padding = "3px";
      div.style.background = "#fff";
    }else if(bs.kind === "filled"){
      div.style.background = bs.color;
      div.style.padding = "4px";
      div.style.borderRadius = "4px";
    }else if(bs.kind === "polaroid"){
      div.style.background = "#fff";
      div.style.padding = "6px 6px 16px";
      div.style.boxShadow = "2px 3px 6px rgba(0,0,0,.4)";
    }

    const img = document.createElement("img");
    img.loading = "lazy";
    img.src = item.thumbURL;
    div.appendChild(img);

    if(item.nsfw && !nsfwUnlocked){
      const badge = document.createElement("div");
      badge.className = "lock-badge";
      badge.textContent = "🔒 R-18";
      div.appendChild(badge);
    }

    const t = document.createElement("div");
    t.className = "title";
    const ts = item.titleStyle || {};
    t.style.color = ts.color || "#333";
    t.style.fontWeight = ts.weight || 400;
    t.style.fontSize = (ts.size||12) + "px";
    if(ts.italic) t.style.fontStyle = "italic";
    t.textContent = item.title || "";
    div.appendChild(t);

    div.addEventListener("click", ()=>{
      if(item.nsfw && !nsfwUnlocked){
        openMini("nsfwOverlay");
        return;
      }
      openModalAt(item.id);
    });

    div.addEventListener("contextmenu", (e)=>{
      if(!isAdmin) return;
      e.preventDefault();
      ctxTargetDocId = item.id;
      const menu = document.getElementById("ctxMenu");
      menu.style.left = e.pageX + "px";
      menu.style.top = e.pageY + "px";
      menu.style.display = "block";
    });

    container.appendChild(div);
  });
}

db.collection(COL_GALLERY).orderBy("createdAt","desc").onSnapshot((snap)=>{
  currentGalleryData = snap.docs.map(d=>{
    const data = d.data();
    if(!data._jitter) data._jitter = randomJitter(); // 클라이언트 표시용 (저장 안됨)
    return { id: d.id, ...data, _jitter: data._jitter || randomJitter() };
  });
  // 매 스냅샷마다 지터가 바뀌면 화면이 덜컹거리므로, 최초 로드시 한번만 캐시
  currentGalleryData.forEach(it=>{
    if(!jitterCache[it.id]) jitterCache[it.id] = it._jitter;
    it._jitter = jitterCache[it.id];
  });
  renderGallery();
});
const jitterCache = {};

/* ============================================================

function visibleList(){

/* ============================================================
   업로드: 이미지 리사이즈 + webp 변환
============================================================ */
function loadImageFile(file){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{ resolve(img); URL.revokeObjectURL(url); };
    img.onerror = reject;
    img.src = url;
  });
}
function resizeToWebP(img, maxDim, quality){
  return new Promise((resolve)=>{
    let { width, height } = img;
    if(width > height && width > maxDim){
      height = Math.round(height * maxDim/width); width = maxDim;
    }else if(height > maxDim){
      width = Math.round(width * maxDim/height); height = maxDim;
    }
    const canvas = document.createElement("canvas");
    canvas.width = width; canvas.height = height;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0, width, height);
    canvas.toBlob((blob)=>resolve(blob), "image/webp", quality);
  });
}

/* ============================================================
   드래그앤드롭 / 파일선택 → 업로드 대기열
============================================================ */
const dropzone = document.getElementById("dropzone");
const fileInput = document.getElementById("fileInput");
let pendingFiles = [];

dropzone.addEventListener("click", ()=> fileInput.click());
fileInput.addEventListener("change", (e)=> handleFiles(e.target.files));
dropzone.addEventListener("dragover", (e)=>{ e.preventDefault(); dropzone.classList.add("dragover"); });
dropzone.addEventListener("dragleave", ()=> dropzone.classList.remove("dragover"));
dropzone.addEventListener("drop", (e)=>{
  e.preventDefault(); dropzone.classList.remove("dragover");
  handleFiles(e.dataTransfer.files);
});

function handleFiles(fileList){
  pendingFiles = Array.from(fileList).filter(f=>f.type.startsWith("image/"));
  if(pendingFiles.length===0) return;
  const listEl = document.getElementById("uploadQueueList");
  listEl.innerHTML = "";
  pendingFiles.forEach((f,idx)=>{
    const row = document.createElement("div");
    row.className = "uploadQueueItem";
    const img = document.createElement("img");
    img.src = URL.createObjectURL(f);
    const span = document.createElement("span");
    span.style.flex = "1";
    span.style.fontSize = "11px";
    span.textContent = f.name;
    const label = document.createElement("label");
    label.style.fontSize = "11px";
    label.innerHTML = `<input type="checkbox" data-idx="${idx}" class="nsfwFlag"> NSFW`;
    row.appendChild(img); row.appendChild(span); row.appendChild(label);
    listEl.appendChild(row);
  });
  openMini("uploadOverlay");
}

document.getElementById("uploadConfirmBtn").onclick = async ()=>{
  const checks = document.querySelectorAll(".nsfwFlag");
  const nsfwMap = {};
  checks.forEach(c=>{ nsfwMap[c.dataset.idx] = c.checked; });
  closeMini("uploadOverlay");
  for(let i=0;i<pendingFiles.length;i++){
    await uploadOneFile(pendingFiles[i], !!nsfwMap[i]);
  }
  pendingFiles = [];
  fileInput.value = "";
};

async function uploadOneFile(file, nsfw){
  try{
    const img = await loadImageFile(file);
    const thumbBlob = await resizeToWebP(img, 360, 0.8);
    const fullBlob = await resizeToWebP(img, 1600, 0.9);
    const stamp = Date.now() + "_" + Math.random().toString(36).slice(2,8);
    const thumbPath = `${STORAGE_PREFIX}/${stamp}_thumb.webp`;
    const fullPath = `${STORAGE_PREFIX}/${stamp}_full.webp`;
    await storage.ref(thumbPath).put(thumbBlob);
    await storage.ref(fullPath).put(fullBlob);
    const thumbURL = await storage.ref(thumbPath).getDownloadURL();
    const fullURL = await storage.ref(fullPath).getDownloadURL();

    await db.collection(COL_GALLERY).add({
      thumbURL, fullURL, thumbPath, fullPath,
      title: randomJPText(),
      titleStyle: randomTitleStyle(),
      boxStyle: randomBoxStyle(),
      nsfw: nsfw,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  }catch(e){
    alert("업로드 실패: " + e.message);
    console.error(e);
  }
}
