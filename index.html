<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HERB</title>

<!--
  ============================================
  파비콘 (favicon) 삽입 코드
  ============================================
  1) 이미지 파일을 쓰고 싶다면 파일을 같은 폴더에 두고 href만 바꾸면 됨:
     <link rel="icon" type="image/png" href="favicon.png">
  2) 지금은 파일 없이도 바로 동작하도록 별 모양 이모지를 SVG 데이터로 넣어둠.
     원하는 이미지가 생기면 아래 한 줄만 교체하면 됨.
-->
<link rel="icon" type="image/png" href="favicon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&family=Noto+Sans+KR:wght@400;500;700&family=Poor+Story&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #333;
    --ink: #f4f5f0;
    --line: #f4f5f0;
    --hover-bg: #ff82dd;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    height:100%;
    overflow: hidden; /* 스파클 효과용 요소들이 문서 흐름에 끼어들며 생기는 스크롤바 방지 */
    background: var(--bg);
    color: var(--ink);
    font-family: 'Noto Sans KR', sans-serif;

    /* ============================================
       커스텀 마우스 커서 삽입 코드
       ============================================
       커서 이미지 파일이 생기면 아래처럼 교체:
       cursor: url('cursor.png') 4 4, auto;
       지금은 기본 커서를 유지하되, 교체 지점만 남겨둠.
    */
    cursor: url('cursor.png') 4 4, auto;
  }

  a, button, .link-item, .add-btn{
    cursor: url('cursor.png') 4 4, auto; /* 클릭 가능한 요소는 커서 파일 준비되면 url()로 교체 */
  }

  .app{
    display:flex;
    height:100vh;
    width:100vw;
  }

  /* ---------- 좌측 사이드바 : 가로 60px 고정 ---------- */
  .sidebar{
    width: 80px;
    min-width: 80px;
    max-width: 80px;
    padding: 100px 5px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 50px;
    background: var(--bg);
    overflow: hidden;
  }

  .add-btn{
    width: 16px;
    height: 16px;
    flex: none;
    border: 1px solid var(--ink);
    color: var(--ink);
    background: transparent;
    font-size: 12px;
    font-weight: 700;
    line-height: 1;
    border-radius: 4px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: background .15s, color .15s;
  }
  .add-btn:hover{
    background: var(--ink);
    color: #ff82dd;
  }

  .site-title{
    font-family: 'Press Start 2P', monospace; /* 픽셀아트 느낌 폰트 */
    font-size: 8px;
    text-decoration: underline;
    text-underline-offset: 1px;
    white-space: nowrap;
    cursor: url('cursor.png') 4 4, pointer; /* 클릭 시 시작 화면으로 복귀 - 커스텀 커서 유지 */
  }
  .site-title:hover{ color: #ff82dd; }

  .link-list{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 15px;
    padding-top: 15px;
    overflow-y:auto;
    overflow-x:hidden;
    width:100%;
    flex:1;
  }

  .link-item{
    position: relative;
    width: 52px;
    font-family: 'Noto Sans KR', sans-serif; /* 가독성을 위해 Noto Sans 사용 */
    font-size: 9px;
  }

  .link-name{
    display:block;
    width: 52px; /* 지시서 규격: 링크 표시 부분 가로 60px(사이드바 폭) 내 표시 */
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    padding: 4px 3px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: #a42bc2;
    text-align: center;
    transition: background .15s;
  }
  .link-name:hover{ background: var(--hover-bg); }

  .link-actions{
    position: absolute;
    top: -12px;
    right: 0;
    display:flex;
    gap: 2px;
    opacity: 0;
    transition: opacity .15s;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 1px 2px;
  }
  .link-item:hover .link-actions{ opacity: 1; }

  .icon-btn{
    background:none;
    border:none;
    font-size: 10px;
    padding: 1px 2px;
    color: var(--ink);
  }
  .del-btn{ font-weight:700; }

  .empty-hint{
    font-size: 9px;
    color:#f4f5f0;
    line-height:1.5;
    text-align:center;
    padding-top: 6px;
  }

  /* ---------- 우측 표시 영역 ---------- */
  .viewer{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width: 0;
  }

  .open-new-tab{
    font-size: 11px;
    text-decoration: underline;
    color: var(--ink);
    display:none;
  }

  .viewer-body{
    flex:1;
    position:relative;
    /* --- 배경 이미지 설정 추가 --- */
    background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('bg.png');
    background-size: auto 100%;    /* 세로 기준 꽉 차게, 가로는 자름 */
    background-position: center;   /* 정중앙 배치 */
    background-repeat: no-repeat;  /* 반복 없음 */
  }

  .viewer-body iframe{
    width:100%;
    height:100%;
    border:none;
  }

  .placeholder{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#ff82dd;
    font-size: 14px;
    text-align:center;
    padding: 20px;
  }

  /* ---------- 모달 (링크 추가/수정) ---------- */
  .modal-overlay{
    position:fixed;
    inset:0;
    background: rgba(0,0,0,.35);
    display:none;
    align-items:center;
    justify-content:center;
    z-index: 999;
  }
  .modal-overlay.open{ display:flex; }

  .modal{
    background:#ff82dd;
    width: 320px;
    padding: 20px;
    display:flex;
    flex-direction:column;
    gap: 12px;
  }

  .modal h3{
    margin:0;
    font-size: 16px;
    color:#151515;
  }

  .modal input{
    padding: 8px;
    border: 1px solid #151515;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
  }

  .modal-actions{
    display:flex;
    justify-content:flex-end;
    gap: 8px;
    margin-top: 4px;
  }

  .modal-actions button{
    background:none;
    border:none;
    padding: 6px 6px;
    font-size: 9px;
  }

  .modal-actions .primary{
    background: var(--ink);
    color:#ff82dd;
    border-color: var(--ink);
  }

  /* ============================================
     미니게임 (Kabukicho Boy) 창
     ============================================ */
  .minigame-wrap{
    position:absolute;
    right: 16px;
    bottom: 16px;
    z-index: 50;
    font-family: 'Poor Story', sans-serif;
  }

  /* --- 숨겨졌을 때 표시되는 작은 버튼 --- */
  .minigame-toggle{
    width: auto;
    height: auto;
    font-size: 12px;
    display: inline-block;
    background: none;
    border: none;
    box-shadow: none;
    padding: 0;
    outline: none;
  }

  @keyframes mg-toggle-pulse{
    0%, 100%{ transform: scale(1); }
    50%{ transform: scale(1.08); }
  }

  /* --- 본 창 --- */
  .minigame-window{
    width: 400px;
    height: 600px;
    max-height: calc(100vh - 32px);
    display:flex;
    flex-direction:column;
    background: #ff82dd;
    border: 2px solid #4971e5;
    border-radius: 8px;
    overflow:hidden;
    box-shadow: 0 6px 24px rgba(0,0,0,.5);
  }

  .minigame-titlebar{
    flex: none;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 4px 6px 4px 10px;
    background: linear-gradient(180deg, #4971e5, #2b48b5);
    color: #fafafa;
  }

  .minigame-titletext{
    font-size: 11px;
    white-space: nowrap;
    overflow:hidden;
    text-overflow: ellipsis;
  }

  .minigame-close{
    flex:none;
    width: 20px;
    height: 20px;
    border: 1px solid #fafafa;
    border-radius: 3px;
    background: #ff861b;
    color: #fafafa;
    font-size: 12px;
    font-weight:700;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .minigame-close:hover{ background: #fe4e6f; }

  .minigame-body{
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 8px;
    padding: 12px 14px 14px;
    overflow-y:auto;
  }

  .minigame-header{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 6px;
  }

  .minigame-heart{
    font-size: 12px;
    color: #fafafa;
  }

  .minigame-title{
    margin: 0;
    font-family: 'Cherry Bomb One', cursive;
    font-size: 26px;
    line-height: 1.05;
    text-align:center;
    -webkit-text-stroke: 4px #fafafa;
    paint-order: stroke fill;
  }

  .title-pink {
    color: #fe4e6f;
  }

  .title-blue {
    color: #4971e5;
  }

.minigame-container {
    display: flex;
    align-items: center; /* 세로 중앙 정렬 */
    justify-content: flex-start; /* 가로 중앙 정렬 (필요 시) */
    align-self: flex-start;
    gap: 5px; /* 두 요소 사이 간격 */
}

.minigame-peeing{
    font-family: 'Cherry Bomb One', monospace;
    font-size: 18px;
    color: #f1d04a;
    -webkit-text-stroke: 4px #2b48b5;
    paint-order: stroke fill;
    padding: 2px 2px;
    cursor: url('cursor.png') 4 4, pointer;
    user-select:none;
    /* 클릭과 무관하게 무한히 떨리도록 설정 */
    animation: mg-shake .15s ease-in-out infinite;
    white-space: nowrap; 
  }
  .minigame-peeing:active{ transform: translateY(1px); }

  .minigame-hearts{
    flex: 1;
    background: #151515;
    padding: 6px 10px;
    text-align:center;
    font-size: 14px;
  }

  @keyframes mg-shake{
    0%, 100%{ transform: translateX(0) rotate(0deg); }
    25%{ transform: translateX(-1px) rotate(-1deg); }
    75%{ transform: translateX(1px) rotate(1deg); }
  }

  .minigame-numbers{
    display:flex;
    gap: 6px;
    align-self: flex-start;
  }

  .num-btn{
    width: auto;
    height: 22px;
    color: #2b48b5;
    font-size: 12px;
    font-weight:700;
    background: transparent;
    border: none;
    outline: none;
    padding: 0 4px;
    white-space: nowrap;
  }

  .minigame-main{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:flex-start;
    gap: 10px;
  }

  .minigame-taichibox{
    width: 150px;
    height: 150px;
    flex: none;
    border: 1px solid #2b48b5;
    background: #151515;
    color: #fafafa;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size: 12px;
    padding: 8px;
    align-self: flex-start;
    overflow: hidden;
    position: relative;
    cursor: url('cursor.png') 4 4, pointer;
  }

  .minigame-taichibox .taichi-placeholder{
    color: #fafafa;
    font-size: 11px;
    line-height: 1.5;
  }

  /* 업로드된 이미지: 클릭 여부와 무관하게 항상 덜컥거리며 거칠게 흔들림 */
  .minigame-taichibox img{
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    /* steps()로 부드러운 보간 없이 뚝뚝 끊어지듯 이동 → 거친 느낌 */
    animation: mg-wobble .45s steps(2, jump-end) infinite;
  }

  @keyframes mg-wobble{
    0%   { transform: translate(0, 0) rotate(0deg); }
    10%  { transform: translate(-1px, -1px) rotate(-1deg); }
    30%  { transform: translate(1px, -2px) rotate(1deg); }
    80%  { transform: translate(-2px, 0) rotate(0deg); }
    90%  { transform: translate(2px, 0) rotate(0deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }

  /* --- 이미지 추가 버튼 --- */
  .add-image-btn{
    width: auto;
    height: 22px;
    color: #2b48b5;
    font-size: 11px;
    font-weight:700;
    border-radius: 3px;
    padding: 0 6px;
    white-space: nowrap;
    cursor: url('cursor.png') 4 4, pointer;
    background: none;
    border: none;
    box-shadow: none;
    padding: 0;
    outline: none;
  }
  .add-image-btn:hover{ color:#fafafa; }

  /* --- 타이치 이미지 업로드 모달 --- */
  .taichi-file-row{
    display:flex;
    align-items:center;
    gap: 8px;
  }

  .taichi-file-row input[type="file"]{
    font-size: 12px;
    flex: 1;
  }

  .taichi-gallery-label{
    font-size: 9px;
    color: #151515;
    margin-top: 4px;
  }

  .taichi-gallery{
    display:grid;
    grid-template-columns: repeat(auto-fill, 64px);
    gap: 6px;
    max-height: 220px;
    min-height: 70px;
    overflow-y:auto;
    padding: 4px;
    border: 1px solid #ccc;
    border-radius: 4px;
    background: #fafafa;
  }

  .taichi-gallery-item{
    width: 64px;
    height: 64px;
    border: 1px solid #2b48b5;
    border-radius: 4px;
    overflow: hidden;
  }

  .taichi-gallery-item img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display:block;
    cursor: url('cursor.png') 4 4, pointer;
  }

  .minigame-speech{
    flex: none;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 4px;
  }

  .speech-bubble{
    position: relative; /* 내부의 화살표를 절대 위치로 앉히기 위한 기준점 */
    background: #fafafa;
    color: #ff2ec6;
    border-radius: 50%;
    padding: 40px 30px;
    font-size: 12px;
    font-style: italic;
    font-weight: 700;
    text-align:center;
    width: 200px;
  }

  .speech-bubble-text{
    display:block;
  }

  .speech-arrow{
    position: absolute;
    right: 30px;
    bottom: 30px;
    font-size: 9px;
    color: #fe4e6f;
    animation: mg-bounce 1s ease-in-out infinite;
    cursor: url('cursor.png') 4 4, pointer;
  }

  @keyframes mg-bounce{
    0%, 100%{ transform: translateY(0); }
    50%{ transform: translateY(5px); }
  }

  .minigame-nametag{
    width: 150px;
    text-align:center;
    background: #151515;
    color: #ff2ec6;
    padding: 6px;
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    align-self: flex-start;
  }

  .minigame-log{
    width:100%;
    flex:1;
    min-height: 90px;
    background: #151515;
    padding: 8px;
    font-size: 14px;
    line-height: 1.6;
    color: #fafafa;
    overflow-y:auto;
  }

  .minigame-log .log-status{ color: #fafafa; }
  .minigame-log .log-talk{ color: #ff82dd; font-weight:700; }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <button class="add-btn" id="addBtn">+</button>
    <div class="site-title" id="siteTitle">💜HERB💜</div>

    <div class="link-list" id="linkList">
      <!-- 링크 항목이 JS로 렌더링됨 -->
    </div>

  </aside>

  <main class="viewer">
    <div class="viewer-bar">
      <a class="open-new-tab" id="openNewTab" target="_blank" rel="noopener">🔑new tap</a>
    </div>
    <div class="viewer-body">
      <iframe id="viewerFrame" style="display:none;"></iframe>

      <!-- ============================================
           미니게임 (Kabukicho Boy)
           - 사이드바 링크 클릭으로 iframe이 바뀌어도
             이 영역은 그대로 유지됨
           - 처음 진입 시 숨김 상태로 시작
           ============================================ -->
      <div class="minigame-wrap" id="minigameWrap">
        <button class="minigame-toggle" id="minigameToggle">💜</button>

        <div class="minigame-window" id="minigameWindow" style="display:none;">
          <div class="minigame-titlebar">
            <span class="minigame-titletext">⋆｡‧˚ʚ🍒ɞ˚‧｡⋆ギャル男さん、天動説って信じます？！⋆｡‧˚ʚ🍒ɞ˚‧｡⋆</span>
            <button class="minigame-close" id="minigameClose" title="숨기기">X</button>
          </div>

          <div class="minigame-body">
            <div class="minigame-header">
              <span class="minigame-heart">₊‧꒰ა💜ɞ ꒦꒷</span>
              <h1 class="minigame-title">
                <span class="title-pink">カブキチョウ</span>
                <span class="title-blue">⭐️ ボーイ</span>
              </h1>
              <span class="minigame-heart">꒷꒦ ʚ💜૮꒱‧₊</span>
            </div>

<div class="minigame-container">
    <div class="minigame-peeing" id="minigamePeeing">I'M PEEING!!</div>
    <div class="minigame-hearts" id="minigameHearts">🧡 🧡 🧡 🧡 🧡 🧡 🧡 🧡 🧡</div>
</div>

            <div class="minigame-numbers" id="minigameNumbers">
              <button class="add-image-btn" id="addTaichiImageBtn">[ Portrait ]</button>
            </div>

            <div class="minigame-main">
              <div class="minigame-taichibox" id="minigameTaichiBox">
                <span class="taichi-placeholder">no portrait</span>
              </div>
              <div class="minigame-speech">
                <div class="speech-bubble">
                  <span class="speech-bubble-text" id="speechBubble"></span>
                  <span class="speech-arrow" id="minigamePet">▼</span>
                </div>
              </div>
            </div>

            <div class="minigame-nametag">☀️TAICHI☀️</div>

            <div class="minigame-log" id="minigameLog"></div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- 링크 추가/수정 모달 -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle">💡new link</h3>
    <input type="text" id="nameInput" placeholder="title">
    <input type="text" id="urlInput" placeholder="addres (https://...)">
    <div class="modal-actions">
      <button id="cancelBtn">❌</button>
      <button id="saveBtn" class="primary">✅</button>
    </div>
  </div>
</div>

<!-- 타이치 이미지 업로드 / 갤러리 모달 -->
<div class="modal-overlay" id="taichiImageModalOverlay">
  <div class="modal">
    <h3>🥵太一、連続絶頂♡🥵</h3>

    <div class="taichi-file-row">
      <input type="file" id="taichiFileInput" accept="image/*" multiple>
    </div>

    <div class="taichi-gallery-label">* Right-click delete</div>
    <div class="taichi-gallery" id="taichiGallery"></div>

    <div class="modal-actions">
      <button id="taichiModalCloseBtn">❌</button>
    </div>
  </div>
</div>

<script type="module">
/* ============================================
   Firebase 초기화 (Firestore, 모듈형 SDK)
   ------------------------------------------
   herb-a0db3 프로젝트의 config 값이 반영되어 있습니다.
   링크 데이터는 'herbLinks' 컬렉션에 저장되며, onSnapshot으로
   실시간 구독하기 때문에 한 기기에서 추가/수정/삭제하면
   다른 기기에도 즉시 반영됩니다.
   ============================================ */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
import {
  getFirestore, collection, addDoc, doc, updateDoc, deleteDoc,
  onSnapshot, query, orderBy, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";
import {
  getStorage, ref as storageRef, uploadBytes, getDownloadURL, deleteObject
} from "https://www.gstatic.com/firebasejs/10.13.1/firebase-storage.js";

};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);
const linksCol = collection(db, 'herbLinks');

// --- 타이치 Portrait 이미지: Firestore(herbTaichiImages 컬렉션) + Storage(파일 본체) ---
const taichiImagesCol = collection(db, 'herbTaichiImages');

// 미니게임 스크립트(별도의 <script type="module">)에서 쓸 수 있도록 window에 노출
// (두 module 스크립트는 서로 다른 스코프라 import를 공유할 수 없어, window 전역으로 넘겨줌)
window.taichiFirebase = {
  db, storage, taichiImagesCol,
  addDoc, doc, deleteDoc, onSnapshot, query, orderBy, serverTimestamp,
  storageRef, uploadBytes, getDownloadURL, deleteObject
};

let links = [];
let editingId = null;

const linkListEl = document.getElementById('linkList');
const modalOverlay = document.getElementById('modalOverlay');
const modalTitle = document.getElementById('modalTitle');
const nameInput = document.getElementById('nameInput');
const urlInput = document.getElementById('urlInput');
const viewerFrame = document.getElementById('viewerFrame');
const openNewTab = document.getElementById('openNewTab');
const siteTitle = document.getElementById('siteTitle');

function normalizeUrl(url){
  if(!/^https?:\/\//i.test(url)) return 'https://' + url;
  return url;
}

function renderLinks(){
  linkListEl.innerHTML = '';

  links.forEach(link => {
    const item = document.createElement('div');
    item.className = 'link-item';

    const nameSpan = document.createElement('span');
    nameSpan.className = 'link-name';
    nameSpan.textContent = link.name;
    nameSpan.title = link.name; // 툴팁: 이름이 길 경우 전체 표시
    nameSpan.addEventListener('click', () => openLink(link));

    const actions = document.createElement('div');
    actions.className = 'link-actions';

    const editBtn = document.createElement('button');
    editBtn.className = 'icon-btn edit-btn';
    editBtn.textContent = '✎';
    editBtn.title = '수정';
    editBtn.addEventListener('click', (e) => { e.stopPropagation(); openEditModal(link); });

    const delBtn = document.createElement('button');
    delBtn.className = 'icon-btn del-btn';
    delBtn.textContent = 'X';
    delBtn.title = '삭제';
    delBtn.addEventListener('click', (e) => { e.stopPropagation(); deleteLink(link.id, link.name); });

    actions.appendChild(editBtn);
    actions.appendChild(delBtn);
    item.appendChild(nameSpan);
    item.appendChild(actions);
    linkListEl.appendChild(item);
  });
}

function openLink(link){
  const url = normalizeUrl(link.url);
  viewerFrame.style.display = 'block';
  viewerFrame.src = url;
  openNewTab.href = url;
  openNewTab.style.display = 'inline';
}

function goToStart(){
  viewerFrame.src = 'about:blank'; // 로딩 중이던 페이지 리소스도 정리
  viewerFrame.style.display = 'none';
  openNewTab.style.display = 'none';
}

function deleteLink(id, name){
  if(!confirm(`'${name}' 🧨링크를 정말 삭제하시겠습니까?`)) return;
  deleteDoc(doc(db, 'herbLinks', id)).catch(err => console.error('삭제 오류:', err));
  // renderLinks()는 onSnapshot이 변경을 감지하면 자동으로 호출됨
}

function openAddModal(){
  editingId = null;
  modalTitle.textContent = '링크 추가';
  nameInput.value = '';
  urlInput.value = '';
  modalOverlay.classList.add('open');
  nameInput.focus();
}

function openEditModal(link){
  editingId = link.id;
  modalTitle.textContent = '링크 수정';
  nameInput.value = link.name;
  urlInput.value = link.url;
  modalOverlay.classList.add('open');
  nameInput.focus();
}

function closeModal(){
  modalOverlay.classList.remove('open');
}

function saveModal(){
  const name = nameInput.value.trim();
  const url = urlInput.value.trim();
  if(!name || !url){
    alert('링크 이름과 주소를 모두 입력해 주세요.');
    return;
  }

  if(editingId){
    updateDoc(doc(db, 'herbLinks', editingId), { name, url })
      .catch(err => console.error('수정 오류:', err));
  }else{
    addDoc(linksCol, { name, url, createdAt: serverTimestamp() })
      .catch(err => console.error('추가 오류:', err));
  }

  // renderLinks()는 onSnapshot이 변경을 감지하면 자동으로 호출됨
  closeModal();
}

document.getElementById('addBtn').addEventListener('click', openAddModal);
siteTitle.addEventListener('click', goToStart);
document.getElementById('cancelBtn').addEventListener('click', closeModal);
document.getElementById('saveBtn').addEventListener('click', saveModal);
modalOverlay.addEventListener('click', (e) => { if(e.target === modalOverlay) closeModal(); });

// Firestore 실시간 구독: 추가/수정/삭제가 일어나면 모든 기기에 자동 반영됨
onSnapshot(query(linksCol, orderBy('createdAt', 'asc')), (snapshot) => {
  links = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
  renderLinks();
}, (error) => {
  console.error('Firestore 구독 오류:', error);
});

</script>

       window.taichiFirebase로 넘겨준 도구를 사용함
     - 사이드바에서 어떤 링크를 눌러도(iframe 변경) 이 영역은
       DOM에서 사라지지 않으므로 계속 표시/상태 유지됨
     ============================================ -->
<script type="module">
(function(){
  const wrapEl = document.getElementById('minigameWrap');
  const toggleBtn = document.getElementById('minigameToggle');
  const windowEl = document.getElementById('minigameWindow');
  const closeBtn = document.getElementById('minigameClose');
  const heartsEl = document.getElementById('minigameHearts');
  const peeingBtn = document.getElementById('minigamePeeing');
  const petArrow = document.getElementById('minigamePet');
  const numbersWrap = document.getElementById('minigameNumbers');
  const taichiBox = document.getElementById('minigameTaichiBox');
  const logEl = document.getElementById('minigameLog');

  // --- 타이치 이미지 업로드 / 갤러리 관련 요소 ---
  const addTaichiImageBtn = document.getElementById('addTaichiImageBtn');
  const taichiImageModalOverlay = document.getElementById('taichiImageModalOverlay');
  const taichiModalCloseBtn = document.getElementById('taichiModalCloseBtn');
  const taichiFileInput = document.getElementById('taichiFileInput');
  const taichiGalleryEl = document.getElementById('taichiGallery');

  // Firebase 관련 도구 (첫 번째 module 스크립트에서 window에 노출해둔 것)
  const {
    db, storage, taichiImagesCol,
    addDoc, doc, deleteDoc, onSnapshot, query, orderBy, serverTimestamp,
    storageRef, uploadBytes, getDownloadURL, deleteObject

  // taichiImages: [{ id, url, storagePath }, ...] — Firestore 실시간 구독으로 채워짐
  let taichiImages = [];
  let currentTaichiImage = null; // 현재 박스에 표시 중인 이미지 객체

  // --- 우측 박스 안에 이미지를 실제로 표시하는 함수 ---
  function renderTaichiBox(){
    taichiBox.innerHTML = '';
    if(!currentTaichiImage){
      const span = document.createElement('span');
      span.className = 'taichi-placeholder';
      span.innerHTML = 'no portrait';
      taichiBox.appendChild(span);
      return;
    }
    const img = document.createElement('img');
    img.src = currentTaichiImage.url;
    img.alt = 'TAICHI';
    taichiBox.appendChild(img);
  }

  // --- 갤러리에 저장된 이미지 중 하나를 무작위로 골라 박스에 표시 ---
  function showRandomTaichiImage(){
    if(taichiImages.length === 0){
      currentTaichiImage = null;
      renderTaichiBox();
      return;
    }
    let candidates = taichiImages;
    // 이미지가 2장 이상이면 방금 보여준 것과 다른 이미지가 나오도록 함
    if(taichiImages.length > 1 && currentTaichiImage){
      candidates = taichiImages.filter(img => img.id !== currentTaichiImage.id);
    }
    const randomIndex = Math.floor(Math.random() * candidates.length);
    currentTaichiImage = candidates[randomIndex];
    renderTaichiBox();
  }

  // --- 박스를 클릭하면 다른 이미지로 무작위 전환 (요청대로 계속 유지) ---
  taichiBox.addEventListener('click', showRandomTaichiImage);

  // --- 방치 시간에 따라 자동으로도 랜덤 전환 ---
  const TAICHI_IMAGE_CHANGE_INTERVAL_MS = 40000; // 40초마다
  setInterval(showRandomTaichiImage, TAICHI_IMAGE_CHANGE_INTERVAL_MS);

  // --- 갤러리(64x64 바둑판) 렌더링 ---
  function renderTaichiGallery(){
    taichiGalleryEl.innerHTML = '';
    if(taichiImages.length === 0){
      const empty = document.createElement('div');
      empty.className = 'taichi-gallery-empty';
      empty.textContent = '등록된 이미지가 없어요.';
      taichiGalleryEl.appendChild(empty);
      return;
    }
    taichiImages.forEach((imgData) => {
      const item = document.createElement('div');
      item.className = 'taichi-gallery-item';

      const img = document.createElement('img');
      img.src = imgData.url;
      img.title = '우클릭으로 삭제';

      // 우클릭(contextmenu) 시 Firestore 문서 + Storage 파일 함께 삭제
      item.addEventListener('contextmenu', async (e) => {
        e.preventDefault();
        if(!confirm('이 이미지를 삭제할까요?')) return;
        try{
          await deleteDoc(doc(db, 'herbTaichiImages', imgData.id));
          if(imgData.storagePath){
            await deleteObject(storageRef(storage, imgData.storagePath)).catch(err => {
              console.error('Storage 파일 삭제 오류:', err);
            });
          }
          // renderTaichiGallery()는 onSnapshot이 변경을 감지하면 자동으로 다시 호출됨
        }catch(err){
          console.error('이미지 삭제 오류:', err);
          alert('이미지 삭제에 실패했어요.');

      });

      item.appendChild(img);
      taichiGalleryEl.appendChild(item);

    taichiImageModalOverlay.classList.add('open');
  }

  function closeTaichiImageModal(){
    taichiImageModalOverlay.classList.remove('open');
  }

        await uploadBytes(fileRef, file);
        const url = await getDownloadURL(fileRef);
        await addDoc(taichiImagesCol, { url, storagePath: path, createdAt: serverTimestamp() });
        // 화면 갱신(갤러리/박스)은 onSnapshot 구독이 자동으로 처리함
      }catch(err){
        console.error('이미지 업로드 오류:', file.name, err);
        alert(`'${file.name}' 업로드에 실패했어요.`);
      }
    }

    taichiFileInput.value = '';
  });

  // --- Firestore 실시간 구독: 다른 기기에서 올리거나 지워도 자동 반영됨 ---
  onSnapshot(query(taichiImagesCol, orderBy('createdAt', 'asc')), (snapshot) => {
    taichiImages = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));

    // 갤러리 모달이 열려있다면 목록 갱신
    if(taichiImageModalOverlay.classList.contains('open')){
      renderTaichiGallery();
    }

    // 아직 아무 이미지도 표시된 적 없으면(=최초 로딩) 무작위로 하나 골라 표시
    if(!currentTaichiImage && taichiImages.length > 0){
      showRandomTaichiImage();
      return;
    }

    // 표시 중이던 이미지가 삭제되어 목록에서 사라졌다면 다른 이미지로 교체
    if(currentTaichiImage && !taichiImages.some(img => img.id === currentTaichiImage.id)){
      showRandomTaichiImage();
    }
  }, (error) => {
    console.error('타이치 이미지 구독 오류:', error);
  });

  function addLog(text, isTalk){
    const line = document.createElement('div');
    line.className = isTalk ? 'log-talk' : 'log-status';
    line.textContent = text;

    logEl.scrollTop = logEl.scrollHeight;

  }

  // --- 초기 상태: 처음 진입 시에는 항상 숨김 상태로 시작 ---
  hideMinigame();

  // --- 말풍선 리스트 ---
  const speechMessages = [
    "자, 자지 쥬세요오옷...♥︎",
    "헤읏!♥︎ 하윽!♥︎ 하아앙...!♥︎",
    "아앙! 앙! 하앙! 뱃속 기분 최고오...♥︎",
    "히읏! 헤응! 헤극! 조아앗!♥︎",
    "♥︎큥큥♥︎ 박히는 거 기, 기분 조아아...♥︎",
    "보지♥︎ 보지 망가져어엇...!♥︎",
    "타이치 보지 준비 완료옷♥︎",
    "빨리! 자지 빨리 바, 박아줘엇!♥︎",
    "여기 암컷 구멍에 박아주데여어어...♥︎",
    "치짱 자지 조아, 조아앗!♥︎"
  ];

  const speechBubbleEl = document.getElementById('speechBubble');

  // --- 방문할 때마다 문장을 무작위로 골라 심어주는 함수 ---
  function changeRandomSpeech() {
    const randomIndex = Math.floor(Math.random() * speechMessages.length);
    speechBubbleEl.textContent = speechMessages[randomIndex];
  }

  // 미니게임 창이 열릴 때마다 문장이 새로 바뀌도록 엮어줍니다
  const originalOpenMinigame = openMinigame;
  openMinigame = function() {
    originalOpenMinigame();
    changeRandomSpeech();
  };

  // --- 말풍선은 클릭이나 창 열림과 무관하게 2초마다 계속 랜덤으로 바뀜 ---
  const SPEECH_CHANGE_INTERVAL_MS = 2000; // 2초마다
  changeRandomSpeech(); // 처음 한 번 즉시 채워줌
  setInterval(changeRandomSpeech, SPEECH_CHANGE_INTERVAL_MS);

  // --- 초기 로그 예시 ---

  addLog("[상태] '타이치'는 한계까지 다리를 활짝 벌리고 대기 중이다...");
  addLog("----------------------------------------");

  toggleBtn.addEventListener('click', openMinigame);
  closeBtn.addEventListener('click', hideMinigame);

// --- 쉬하기 버튼을 눌렀을 때 나올 수 있는 문장들의 목록 ---
  const peeingMessages = [
    { text: "[상태 : 🩷암캐🩷] '타이치'가 참지 못하고 쉬를 쏟아내기 시작했다!", isTalk: false },
    { text: ">> 타이치 : 나온, 나오, 나온닷...! 흐으읏!♡♡♡", isTalk: true },
    { text: "[상태 : 🩷발정🩷] '타이치'의 몸이 부르르 떨리며 다리 사이에 쪼르륵 웅덩이가 고인다.", isTalk: false },
    { text: ">> 타이치 : 우으읏... 이렇게 잔뜩 싸는 거, 치짱한테 전부 들켜버렸어...♡", isTalk: true },
    { text: ">> 타이치 : 아앗, 흘러내리는 거 보지 마아...! 누, 눈 감아줘...!♡", isTalk: true },

    const randomIndex = Math.floor(Math.random() * peeingMessages.length);
    const selected = peeingMessages[randomIndex];

    addLog(selected.text, selected.isTalk);
  });

let petMessages = [];

fetch('./petMessages.json')
  .then(res => res.json())
  .then(data => {
    petMessages = data;
  });

  petArrow.addEventListener('click', () => {
    // 목록 안에서 무작위로 하나의 문장을 골라냅니다
    if (!petMessages || petMessages.length === 0) return;
    const randomIndex = Math.floor(Math.random() * petMessages.length);
    const selected = petMessages[randomIndex];
    addLog(selected.text, selected.isTalk);
  });

// --- 방치(클릭 없이 그냥 켜둠) 시에도 일정 주기마다 랜덤 문장을 자동 출력 ---
// (창이 닫혀있어도 계속 진행됨)
  const AUTO_MESSAGE_INTERVAL_MS = 20000; // 20초마다

  function pickRandomAutoMessage(){
    // 쉬하기 문장 + 상호작용 문장을 합쳐서 그 중 하나를 무작위로 고릅니다
    const pool = [...peeingMessages, ...petMessages];
    if (pool.length === 0) return;
    const randomIndex = Math.floor(Math.random() * pool.length);
    const selected = pool[randomIndex];
    addLog(selected.text, selected.isTalk);
  }

  setInterval(() => {
    pickRandomAutoMessage();
  }, AUTO_MESSAGE_INTERVAL_MS);
})();
</script>

    document.body.appendChild(star[i]=rats);
  }
  set_width();
  sparkle();
}}

function sparkle() {
  var c;
  if (x!=ox || y!=oy) {
    ox=x;
    oy=y;
    for (c=0; c<sparkles; c++) if (!starv[c]) {
      star[c].style.left=(starx[c]=x)+"px";
      star[c].style.top=(stary[c]=y)+"px";
      star[c].style.clip="rect(0px, 5px, 5px, 0px)";
      star[c].style.visibility="visible";
      starv[c]=50;
      break;
    }
  }
  for (c=0; c<sparkles; c++) {
    if (starv[c]) update_star(c);
    if (tinyv[c]) update_tiny(c);
  }
  setTimeout("sparkle()", 40);
}

function update_star(i) {
  if (--starv[i]==25) star[i].style.clip="rect(1px, 4px, 4px, 1px)";
  if (starv[i]) {
    stary[i]+=1+Math.random()*3;
    if (stary[i]<shigh+sdown) {
      star[i].style.top=stary[i]+"px";
      starx[i]+=(i%5-2)/5;
      star[i].style.left=starx[i]+"px";
    }
    else {
      star[i].style.visibility="hidden";
      starv[i]=0;
      return;
    }
  }
  else {
    tinyv[i]=50;
    tiny[i].style.top=(tinyy[i]=stary[i])+"px";
    tiny[i].style.left=(tinyx[i]=starx[i])+"px";
    tiny[i].style.width="2px";
    tiny[i].style.height="2px";
    star[i].style.visibility="hidden";
    tiny[i].style.visibility="visible"
  }
}

function update_tiny(i) {
  if (--tinyv[i]==25) {
    tiny[i].style.width="1px";
    tiny[i].style.height="1px";
  }
  if (tinyv[i]) {
    tinyy[i]+=1+Math.random()*3;
    if (tinyy[i]<shigh+sdown) {
      tiny[i].style.top=tinyy[i]+"px";
      tinyx[i]+=(i%5-2)/5;
      tiny[i].style.left=tinyx[i]+"px";
    }
    else {
      tiny[i].style.visibility="hidden";
      tinyv[i]=0;
      return;
    }
  }
  else tiny[i].style.visibility="hidden";
}

document.onmousemove=mouse;
function mouse(e) {
  set_scroll();
  y=(e)?e.pageY:event.y+sdown;
  x=(e)?e.pageX:event.x+sleft;
}

function set_scroll() {
  if (typeof(self.pageYOffset)=="number") {
    sdown=self.pageYOffset;
    sleft=self.pageXOffset;
  }
  else if (document.body.scrollTop || document.body.scrollLeft) {
    sdown=document.body.scrollTop;
    sleft=document.body.scrollLeft;
  }
  else if (document.documentElement && (document.documentElement.scrollTop || document.documentElement.scrollLeft)) {
    sleft=document.documentElement.scrollLeft;
	sdown=document.documentElement.scrollTop;
  }
  else {
    sdown=0;
    sleft=0;
  }
}

window.onresize=set_width;
function set_width() {
  if (typeof(self.innerWidth)=="number") {
    swide=self.innerWidth;
    shigh=self.innerHeight;
  }
  else if (document.documentElement && document.documentElement.clientWidth) {
    swide=document.documentElement.clientWidth;
    shigh=document.documentElement.clientHeight;
  }
  else if (document.body.clientWidth) {
    swide=document.body.clientWidth;
    shigh=document.body.clientHeight;
  }
}

function createDiv(height, width) {
  var div=document.createElement("div");
  div.style.position="absolute";
  div.style.top="0px";
  div.style.left="0px";
  div.style.height=height+"px";
  div.style.width=width+"px";
  div.style.overflow="hidden";
  div.style.backgroundColor=colour;
  return (div);
}
</script>
