     <link rel="icon" type="image/png" href="favicon.png">
-->

<style>
  :root{
    --bg: #9bbc0f;
    --ink: #0f380f;
    --line: #0f380f;
    --hover-bg: #8bac0f;

  html, body{

    padding:0;
    height:100%;
    overflow: hidden; /* 스파클 효과용 요소들이 문서 흐름에 끼어들며 생기는 스크롤바 방지 */

  .app{
    display:flex;
    height:100vh;
    width:100vw;

  /* ---------- 좌측 사이드바 : 가로 60px 고정 ---------- */
  .sidebar{
    width: 80px;
    min-width: 80px;
    max-width: 80px;
    padding: 100px 5px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 50px;
    background: var(--bg);
    overflow: hidden;
  }

  .add-btn{
    width: 16px;
    height: 16px;
    flex: none;
    border: 1px solid var(--ink);
    color: var(--ink);
    background: transparent;
    font-size: 12px;
    font-weight: 700;
    line-height: 1;
    border-radius: 4px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: background .15s, color .15s;
  }
  .add-btn:hover{
    background: var(--ink);
    color: #8bac0f;
  }

  .site-title{
    font-family: 'Press Start 2P', monospace; /* 픽셀아트 느낌 폰트 */
    font-size: 8px;
    text-decoration: underline;
    text-underline-offset: 1px;
    white-space: nowrap;
  }
  .site-title:hover{ color: #8bac0f; }

  .link-list{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 15px;
    padding-top: 15px;
    overflow-y:auto;
    overflow-x:hidden;
    width:100%;
    flex:1;
  }

  .link-item{
    position: relative;
    width: 52px;
    font-family: 'Noto Sans KR', sans-serif; /* 가독성을 위해 Noto Sans 사용 */
    font-size: 9px;
    transition: transform .12s ease;
  }

  .link-item.dragging{
    opacity: .35;
  }

  .link-item.drag-over-top::before,
  .link-item.drag-over-bottom::after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    height:2px;
    background: var(--ink);
    border-radius: 2px;
  }
  .link-item.drag-over-top::before{ top: -8px; }
  .link-item.drag-over-bottom::after{ bottom: -8px; }

  .link-name{
    display:block;
    width: 52px; /* 지시서 규격: 링크 표시 부분 가로 60px(사이드바 폭) 내 표시 */
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    padding: 4px 3px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: #8bac0f;
    text-align: center;
    transition: background .15s;
    cursor: grab;
    user-select: none;
  }
  .link-name:hover{ background: var(--hover-bg); }
  .link-item.dragging .link-name{ cursor: grabbing; }

  .link-actions{
    position: absolute;
    top: -12px;
    right: 0;
    display:flex;
    gap: 2px;
    opacity: 0;
    transition: opacity .15s;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 1px 2px;
  }
  .link-item:hover .link-actions{ opacity: 1; }

  .icon-btn{
    background:none;
    border:none;
    font-size: 10px;
    padding: 1px 2px;
    color: var(--ink);
  }
  .del-btn{ font-weight:700; }

  .empty-hint{
    font-size: 9px;
    color:#f4f5f0;
    line-height:1.5;
    text-align:center;
    padding-top: 6px;
  }

  /* ---------- 우측 표시 영역 ---------- */
  .viewer{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width: 0;
  }

  .open-new-tab{
    font-size: 11px;
    text-decoration: underline;

  }

  .viewer-body{
    flex:1;

  }

  .viewer-body iframe{

    border:none;

  .placeholder{
    position:absolute;
    inset:0;

    align-items:center;
    justify-content:center;

    text-align:center;

  /* ---------- 모달 (링크 추가/수정) ---------- */
  .modal-overlay{
    position:fixed;
    inset:0;
    background: #0f380f;
    display:none;
    align-items:center;
    justify-content:center;
    z-index: 999;

  .modal-overlay.open{ display:flex; }

  .modal{
    background:#8bac0f;
    width: 320px;
    padding: 20px;
    display:flex;
    flex-direction:column;
    gap: 12px;

  .modal h3{
    margin:0;

  }

  .modal-actions{

  /* ---------- 모달 (유튜브 플레이리스트) ---------- */

  .field input{
    padding: 8px;

  .form-hint{
    margin:0;

  .btn-submit{
    background: var(--ink);

  .btn-submit:hover{ opacity:.85; }
  .btn-submit:disabled{ opacity:.5; cursor:not-allowed; }

    /* ---------- 임시 메모장 ---------- */
    .memo-box{
    position:absolute;
    top: 40px;
    left: 40px;
    width: 560px;
    height: 400px;
    min-width: 220px;
    min-height: 120px;

    overflow: auto;

    background: #8bac0f;

  }

    /* ---------- youtube player bar ---------- */
  .topbar-actions{
    display:flex;
    align-items:center;

  .btn-icon{
    background:none;
    border:none;
    color:var(--brand);
    width:20px;
    height:20px;
    flex-shrink:0;
    font-size:.8rem;
    display:flex;

    justify-content:center;

    box-shadow: none;

  .btn-icon:hover{ background:var(--brand-12); }

  #ytPlayerHolder{

  /* ---------- playlist ---------- */
  .playlist-list{
    list-style:none;
    margin:16px 0 0;
    padding:8px 0 0;
    max-height:220px;
    overflow-y:auto;

  }
  .playlist-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:9px 2px;

  .playlist-title{
    flex:1;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;

  }
  .playlist-del{
    flex-shrink:0;
    background:none;
    border:1px solid #0f380f;

  .playlist-del:hover{ background:#8bac0f; }

  .playlist-empty{

    /* 스크롤바: 오렌지 컬러로 통일 */

    background:var(--bg);

    border:2px solid var(--ink);
  }
  *::-webkit-scrollbar-corner{ background: transparent; }

</style>

<script type="module">
/* ============================================
   Firebase 초기화 (Firestore, 모듈형 SDK)
   ------------------------------------------
   herb-a0db3 프로젝트의 config 값이 반영되어 있습니다.
   링크 데이터는 'herbLinks' 컬렉션에 저장되며, onSnapshot으로
   실시간 구독하기 때문에 한 기기에서 추가/수정/삭제하면
   다른 기기에도 즉시 반영됩니다.
   ============================================ */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
import {
  getFirestore, collection, addDoc, doc, updateDoc, deleteDoc,
  onSnapshot, query, orderBy, limit, serverTimestamp, writeBatch
} from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDQ8Yp6GMGXZ9DRjSdHkxom_Jx50ELwApA",
  authDomain: "herb-a0db3.firebaseapp.com",
  databaseURL: "https://herb-a0db3-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "herb-a0db3",
  storageBucket: "herb-a0db3.firebasestorage.app",
  messagingSenderId: "244376314992",
  appId: "1:244376314992:web:c12c2be7fa844ccaabc0b5"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const linksCol = collection(db, 'herbLinks');

let links = [];
let editingId = null;
let draggedId = null;

const linkListEl = document.getElementById('linkList');
const modalOverlay = document.getElementById('modalOverlay');
const modalTitle = document.getElementById('modalTitle');
const nameInput = document.getElementById('nameInput');
const urlInput = document.getElementById('urlInput');
const viewerFrame = document.getElementById('viewerFrame');
const openNewTab = document.getElementById('openNewTab');
const siteTitle = document.getElementById('siteTitle');
const memoBox = document.getElementById('memoBox');

  // ---------------- youtube player refs ----------------
  const ytToggleBtn = document.getElementById("ytToggleBtn");
  const openPlaylistBtn = document.getElementById("openPlaylistBtn");
  const playlistModalOverlay = document.getElementById("playlistModalOverlay");
  const closePlaylistModal = document.getElementById("closePlaylistModal");
  const playlistForm = document.getElementById("playlistForm");
  const youtubeUrlInput = document.getElementById("youtubeUrlInput");
  const playlistFormHint = document.getElementById("playlistFormHint");
  const playlistSubmitBtn = document.getElementById("playlistSubmitBtn");
  const playlistList = document.getElementById("playlistList");
  const playlistEmpty = document.getElementById("playlistEmpty");

  const PLAYLIST_COLLECTION = "herb_playlist";
  const playlistCache = new Map();
  let ytPlayer = null;
  let ytApiScriptAdded = false;
  let ytApiCallbacks = [];
  let playQueue = [];
  let queueIndex = -1;

function normalizeUrl(url){
  if(!/^https?:\/\//i.test(url)) return 'https://' + url;
  return url;
}

function renderLinks(){
  linkListEl.innerHTML = '';

  links.forEach(link => {
    const item = document.createElement('div');
    item.className = 'link-item';
    item.draggable = true;
    item.dataset.id = link.id;

    item.addEventListener('dragstart', (e) => {
      draggedId = link.id;
      item.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', link.id);
    });

    item.addEventListener('dragend', () => {
      draggedId = null;
      document.querySelectorAll('.link-item').forEach(el => {
        el.classList.remove('dragging', 'drag-over-top', 'drag-over-bottom');
      });
    });

    item.addEventListener('dragover', (e) => {
      if(!draggedId || draggedId === link.id) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      const rect = item.getBoundingClientRect();
      const before = (e.clientY - rect.top) < rect.height / 2;
      item.classList.toggle('drag-over-top', before);
      item.classList.toggle('drag-over-bottom', !before);
    });

    item.addEventListener('dragleave', () => {
      item.classList.remove('drag-over-top', 'drag-over-bottom');
    });

    item.addEventListener('drop', (e) => {
      e.preventDefault();
      const before = item.classList.contains('drag-over-top');
      item.classList.remove('drag-over-top', 'drag-over-bottom');
      if(!draggedId || draggedId === link.id) return;
      reorderLinks(draggedId, link.id, before);
    });

    const nameSpan = document.createElement('span');
    nameSpan.className = 'link-name';
    nameSpan.textContent = link.name;
    nameSpan.title = link.name; // 툴팁: 이름이 길 경우 전체 표시
    nameSpan.addEventListener('click', () => openLink(link));

    const actions = document.createElement('div');
    actions.className = 'link-actions';

    const editBtn = document.createElement('button');
    editBtn.className = 'icon-btn edit-btn';
    editBtn.textContent = '✎';
    editBtn.title = '수정';
    editBtn.addEventListener('click', (e) => { e.stopPropagation(); openEditModal(link); });

    const delBtn = document.createElement('button');
    delBtn.className = 'icon-btn del-btn';
    delBtn.textContent = 'X';
    delBtn.title = '삭제';
    delBtn.addEventListener('click', (e) => { e.stopPropagation(); deleteLink(link.id, link.name); });

    actions.appendChild(editBtn);
    actions.appendChild(delBtn);
    item.appendChild(nameSpan);
    item.appendChild(actions);
    linkListEl.appendChild(item);
  });
}

function reorderLinks(fromId, toId, insertBefore){
  const fromIndex = links.findIndex(l => l.id === fromId);
  let toIndex = links.findIndex(l => l.id === toId);
  if(fromIndex === -1 || toIndex === -1 || fromIndex === toIndex) return;

  const newLinks = [...links];
  const [moved] = newLinks.splice(fromIndex, 1);

  // splice로 인덱스가 밀렸을 수 있으므로 다시 계산
  toIndex = newLinks.findIndex(l => l.id === toId);
  const insertAt = insertBefore ? toIndex : toIndex + 1;
  newLinks.splice(insertAt, 0, moved);

  links = newLinks;
  renderLinks(); // Firestore 응답을 기다리지 않고 즉시 화면 갱신
  persistOrder(newLinks);
}

async function persistOrder(orderedLinks){
  try{
    const batch = writeBatch(db);
    orderedLinks.forEach((link, index) => {
      batch.update(doc(db, 'herbLinks', link.id), { order: index });
    });
    await batch.commit();
  }catch(err){
    console.error('순서 저장 오류:', err);
  }
}

function openLink(link){
  const url = normalizeUrl(link.url);
  memoBox.style.display = 'none';
  viewerFrame.style.display = 'block';
  viewerFrame.src = url;
  openNewTab.href = url;
  openNewTab.style.display = 'inline';
}

function goToStart(){
  viewerFrame.src = 'about:blank'; // 로딩 중이던 페이지 리소스도 정리
  viewerFrame.style.display = 'none';
  openNewTab.style.display = 'none';
  memoBox.style.display = 'block';
}

function deleteLink(id, name){
  if(!confirm(`'${name}' 🧨링크를 정말 삭제하시겠습니까?`)) return;
  deleteDoc(doc(db, 'herbLinks', id)).catch(err => console.error('삭제 오류:', err));
  // renderLinks()는 onSnapshot이 변경을 감지하면 자동으로 호출됨
}

function openAddModal(){
  editingId = null;
  modalTitle.textContent = '링크 추가';
  nameInput.value = '';
  urlInput.value = '';
  modalOverlay.classList.add('open');
  nameInput.focus();
}

function openEditModal(link){
  editingId = link.id;
  modalTitle.textContent = '링크 수정';
  nameInput.value = link.name;
  urlInput.value = link.url;
  modalOverlay.classList.add('open');
  nameInput.focus();
}

function closeModal(){
  modalOverlay.classList.remove('open');
}

function saveModal(){
  const name = nameInput.value.trim();
  const url = urlInput.value.trim();
  if(!name || !url){
    alert('링크 이름과 주소를 모두 입력해 주세요.');
    return;
  }

  if(editingId){
    updateDoc(doc(db, 'herbLinks', editingId), { name, url })
      .catch(err => console.error('수정 오류:', err));
  }else{
    addDoc(linksCol, { name, url, order: links.length, createdAt: serverTimestamp() })
      .catch(err => console.error('추가 오류:', err));
  }

  // renderLinks()는 onSnapshot이 변경을 감지하면 자동으로 호출됨
  closeModal();
}

document.getElementById('addBtn').addEventListener('click', openAddModal);
siteTitle.addEventListener('click', goToStart);
document.getElementById('cancelBtn').addEventListener('click', closeModal);
document.getElementById('saveBtn').addEventListener('click', saveModal);
modalOverlay.addEventListener('click', (e) => { if(e.target === modalOverlay) closeModal(); });

// Firestore 실시간 구독: 추가/수정/삭제가 일어나면 모든 기기에 자동 반영됨
onSnapshot(query(linksCol, orderBy('createdAt', 'asc')), (snapshot) => {
  const fetched = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
  // order 필드가 있는 항목은 그 값으로, 없는 항목(기존 데이터)은
  // createdAt 순서를 유지한 채 맨 뒤로 안정 정렬됨.
  fetched.sort((a, b) => {
    const ao = typeof a.order === 'number' ? a.order : Number.MAX_SAFE_INTEGER;
    const bo = typeof b.order === 'number' ? b.order : Number.MAX_SAFE_INTEGER;
    return ao - bo;
  });
  links = fetched;
  renderLinks();
}, (error) => {
  console.error('Firestore 구독 오류:', error);
});

  // ================= 유튜브 플레이어 / 플레이리스트 =================

  // ---------------- youtube iframe api 로드 ----------------
  function ensureYtApi(callback){
    if (window.YT && window.YT.Player) { callback(); return; }
    ytApiCallbacks.push(callback);
    if (!ytApiScriptAdded) {
      ytApiScriptAdded = true;
      const tag = document.createElement("script");
      tag.src = "https://www.youtube.com/iframe_api";
      document.head.appendChild(tag);
      window.onYouTubeIframeAPIReady = function () {
        const callbacks = ytApiCallbacks;
        ytApiCallbacks = [];
        callbacks.forEach((fn) => fn());
      };
    }
  }

  // ---------------- 링크 파싱 / 제목 조회 ----------------
  function extractYoutubeId(url){
    if (!url) return null;
    const patterns = [
      /youtube\.com\/watch\?v=([a-zA-Z0-9_-]{11})/,
      /youtu\.be\/([a-zA-Z0-9_-]{11})/,
      /youtube\.com\/embed\/([a-zA-Z0-9_-]{11})/,
      /youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/
    ];
    for (const p of patterns) {
      const m = url.match(p);
      if (m) return m[1];
    }
    return null;
  }

  async function fetchYoutubeTitle(url){
    try {
      const res = await fetch(`https://www.youtube.com/oembed?url=${encodeURIComponent(url)}&format=json`);
      if (!res.ok) throw new Error("oEmbed 요청 실패");
      const data = await res.json();
      return data.title || "";
    } catch (err) {
      console.warn("유튜브 제목 조회 실패:", err);
      return "";
    }
  }

  // ---------------- 랜덤 재생 큐 ----------------
  function shuffleArray(arr){
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function buildQueue(){
    return shuffleArray(Array.from(playlistCache.keys()));
  }

  function setToggleIcon(playing){
    ytToggleBtn.textContent = playing ? "⏸" : "▶";
  }

  function startPlayback(){
    if (playlistCache.size === 0) {
      alert("재생목록이 비어 있습니다. 먼저 유튜브 링크를 추가해주세요.");
      return;
    }
    ensureYtApi(() => {
      if (!ytPlayer) {
        playQueue = buildQueue();
        queueIndex = 0;
        const firstId = playlistCache.get(playQueue[queueIndex]).videoId;
        ytPlayer = new YT.Player("ytPlayer", {
          videoId: firstId,
          playerVars: { autoplay: 1, controls: 0 },
          events: {
            onReady: (e) => e.target.playVideo(),
            onStateChange: onPlayerStateChange
          }
        });
      } else {
        ytPlayer.playVideo();
      }
    });
  }

  function togglePlayback(){
    if (ytPlayer && typeof ytPlayer.getPlayerState === "function") {
      const state = ytPlayer.getPlayerState();
      if (state === YT.PlayerState.PLAYING) {
        ytPlayer.pauseVideo();
        return;
      }
    }
    startPlayback();
  }

  function onPlayerStateChange(e){
    if (e.data === YT.PlayerState.PLAYING) {
      setToggleIcon(true);
    } else if (e.data === YT.PlayerState.PAUSED) {
      setToggleIcon(false);
    } else if (e.data === YT.PlayerState.ENDED) {
      playNext();
    }
  }

  function playNext(){
    if (playlistCache.size === 0) {
      setToggleIcon(false);
      return;
    }
    queueIndex++;
    if (queueIndex >= playQueue.length || !playlistCache.has(playQueue[queueIndex])) {
      playQueue = buildQueue();
      queueIndex = 0;
    }
    const nextItem = playlistCache.get(playQueue[queueIndex]);
    if (!nextItem) {
      setToggleIcon(false);
      return;
    }
    ytPlayer.loadVideoById(nextItem.videoId);
  }

  ytToggleBtn.addEventListener("click", togglePlayback);
  listenToPlaylist();

  // ---------------- 플레이리스트 모달 ----------------
  function openModal(overlay){
    overlay.classList.add('open');
  }
  function closeModalFn(overlay){
    overlay.classList.remove('open');
  }

  openPlaylistBtn.addEventListener("click", () => {
    youtubeUrlInput.value = "";
    playlistFormHint.textContent = "";
    openModal(playlistModalOverlay);
  });
  closePlaylistModal.addEventListener("click", () => closeModalFn(playlistModalOverlay));
  playlistModalOverlay.addEventListener("click", (e) => {
    if (e.target === playlistModalOverlay) closeModalFn(playlistModalOverlay);
  });

  playlistForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const raw = youtubeUrlInput.value.trim();
    const videoId = extractYoutubeId(raw);
    if (!videoId) {
      playlistFormHint.textContent = "유효한 유튜브 링크가 아닙니다.";
      return;
    }
    playlistSubmitBtn.disabled = true;
    playlistFormHint.textContent = "추가 중...";
    try {
      const normalizedUrl = `https://www.youtube.com/watch?v=${videoId}`;
      const title = await fetchYoutubeTitle(normalizedUrl);
      await addDoc(collection(db, PLAYLIST_COLLECTION), {
        videoId,
        title: title || normalizedUrl,
        url: normalizedUrl,
        createdAt: serverTimestamp()
      });
      youtubeUrlInput.value = "";
      playlistFormHint.textContent = "";
    } catch (err) {
      console.error(err);
      playlistFormHint.textContent = "추가 중 오류가 발생했습니다.";
    } finally {
      playlistSubmitBtn.disabled = false;
    }
  });

  function listenToPlaylist(){
    const q = query(collection(db, PLAYLIST_COLLECTION), orderBy("createdAt", "desc"), limit(200));
    onSnapshot(
      q,
      (snapshot) => {
        playlistCache.clear();
        snapshot.docs.forEach((d) => playlistCache.set(d.id, { id: d.id, ...d.data() }));
        renderPlaylist();
      },
      (err) => console.error(err)
    );
  }

  function renderPlaylist(){
    playlistList.querySelectorAll(".playlist-item").forEach((el) => el.remove());
    playlistEmpty.style.display = playlistCache.size ? "none" : "block";
    playlistCache.forEach((item) => {
      const li = document.createElement("li");
      li.className = "playlist-item";

      const span = document.createElement("span");
      span.className = "playlist-title";
      span.textContent = item.title || item.url || item.videoId;

      const delBtn = document.createElement("button");
      delBtn.type = "button";
      delBtn.className = "playlist-del";
      delBtn.textContent = "✕";
      delBtn.addEventListener("click", () => deletePlaylistItem(item.id));

      li.appendChild(span);
      li.appendChild(delBtn);
      playlistList.appendChild(li);
    });
  }

  async function deletePlaylistItem(id){
    const item = playlistCache.get(id);
    const label = item && item.title ? item.title : "이 곡";
    const ok = window.confirm(`"${label}"을(를) 삭제하시겠습니까?`);
    if (!ok) return;
    try {
      await deleteDoc(doc(db, PLAYLIST_COLLECTION, id));
      if (item) {
        playQueue = playQueue.filter((vid) => vid !== item.id);
        if (ytPlayer && typeof ytPlayer.getVideoData === "function") {
          const current = ytPlayer.getVideoData();
          if (current && current.video_id === item.videoId) {
            playNext();
          }
        }
      }
    } catch (err) {
      console.error(err);
      alert("삭제 중 오류가 발생했습니다.");
    }
  }

</script>
